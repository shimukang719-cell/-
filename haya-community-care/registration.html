<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | Haya Community Care Demo</title><style> :root{font-family:Arial,sans-serif;color:#214b37;background:#f1f9f3}*{box-sizing:border-box}body{margin:0}header{background:#d9f1e3;padding:22px 6%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}a{color:#17663e}main{max-width:1000px;margin:35px auto;padding:0 18px}.card{background:white;border:1px solid #dcece1;border-radius:18px;padding:28px;box-shadow:0 8px 25px #193e2610;margin:15px 0}h1{margin:0;font-size:25px}h2{margin-top:0}label{font-weight:bold;display:block;margin:18px 0 8px}input,select{width:100%;padding:14px;border:1px solid #a8cbb5;border-radius:9px;font-size:17px}button{border:0;background:#086839;color:white;border-radius:9px;padding:14px 22px;cursor:pointer;font-size:16px;margin-top:20px}button:hover{background:#07512f}.subtle{color:#546b5c}.warning{background:#fff2d8;border-radius:9px;padding:14px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{padding:22px;background:#e2f4e8;border-radius:12px}.stat strong{display:block;font-size:28px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:740px}th,td{border-bottom:1px solid #e4ece7;padding:12px;text-align:left}td button{margin:0;padding:7px 10px;font-size:13px}select.status{font-size:14px;padding:7px}footer{text-align:center;padding:25px;color:#57705d}@media(max-width:600px){header{display:block}h1{font-size:21px}}</style></head><body><header><h1>Haya Community Care · Registration</h1><nav><a href="index.html">Home</a> · <a href="admin.html">Admin Demo</a></nav></header><main><div class="card"><h2>Join our community</h2><p class="subtle">Standalone registration page — local practice only.</p><p class="warning">Use fictional names and emails only. Entries stay in this browser and are not protected as real client records.</p><form id="registerForm"><label for="name">Full name</label><input id="name" required maxlength="100" placeholder="Example Person"><label for="email">Email address</label><input id="email" type="email" required placeholder="example@example.com"><label for="role">I am interested in</label><select id="role" required><option value="">Choose an option</option><option>Receiving community support</option><option>Volunteering</option><option>Learning more about the project</option></select><button type="submit">Continue Registration →</button></form><p id="message" role="status" class="hidden warning"></p></div></main><footer>Local demo · No account created · No data sent</footer><script>
const STORE='haya-demo-registrations-v1';
document.getElementById('registerForm').addEventListener('submit',event=>{event.preventDefault();try{const list=JSON.parse(localStorage.getItem(STORE)||'[]');list.push({id:globalThis.crypto?.randomUUID?.()||String(Date.now()),name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),role:document.getElementById('role').value,date:new Date().toISOString().slice(0,10),status:'Pending'});localStorage.setItem(STORE,JSON.stringify(list));document.getElementById('message').textContent='Demo registration saved locally. Open Admin Demo to view it.';document.getElementById('message').classList.remove('hidden');event.target.reset();}catch(error){alert('Browser local storage is unavailable. See README for the localhost method.');}});
</script></body></html>
